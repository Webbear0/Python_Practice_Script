<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PythonMyAdmin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- CSP 禁止内联脚本，所有 JS 放在 static/app.js -->
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{{ url_for('databases') }}">PythonMyAdmin</a>
        {% if g.info %}
        <span class="who">{{ g.info.user }}@{{ g.info.host }}:{{ g.info.port }}</span>
        <form method="post" action="{{ url_for('logout') }}">
            <input type="hidden" name="csrf" value="{{ csrf_token() }}">
            <button class="btn small">退出</button>
        </form>
        {% endif %}
    </header>
    <main>
        {% block crumbs %}{% endblock %}
        {% for msg in get_flashed_messages() %}
        <div class="flash">{{ msg }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
