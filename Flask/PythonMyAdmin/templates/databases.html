{% extends "base.html" %}
{% block crumbs %}<nav class="crumbs">数据库</nav>{% endblock %}
{% block content %}
<form method="post" action="{{ url_for('create_db') }}" class="toolbar">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <input name="name" placeholder="新数据库名（字母/数字/下划线）" pattern="[A-Za-z0-9_]{1,64}" required>
    <select name="charset">
        {% for c in charsets %}<option>{{ c }}</option>{% endfor %}
    </select>
    <button class="btn primary">新建数据库</button>
</form>

<table>
    <tr><th>数据库</th><th>字符集</th><th>表数量</th></tr>
    {% for d in dbs %}
    <tr>
        <td>
            <a href="{{ url_for('tables', db=d.name) }}">{{ d.name }}</a>
            {% if d.name in system %}<span class="tag">系统库</span>{% endif %}
        </td>
        <td>{{ d.charset }}</td>
        <td>{{ d.tables }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
