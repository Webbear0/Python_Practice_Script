# ops_monitor.conf -- Nginx 反向代理配置 (子域名方案)
# 部署位置: /etc/nginx/conf.d/ops_monitor.conf
# 测试配置: nginx -t
# 重载生效: systemctl reload nginx
#
# DNS 前提: 需将以下三个域名全部解析到 Proxy_server 的公网 IP:
#   www.test.com   -> 门户主页 + 运维监控看板
#   blog.test.com  -> 博客 (反代至 server01)
#   bbs.test.com   -> 论坛 (反代至 server02)
#
# [域名配置] 若域名变更, 全局替换 test.com 即可 (共 3 处 server_name)


# ============================================================
# 虚拟主机 1: 门户 + 监控看板
# 域名: www.test.com
# 后端: Gunicorn (Flask) 监听 127.0.0.1:8000
# 路由:
#   /           -> 门户主页 (portal.html)
#   /ops        -> 运维监控看板 (index.html + pyecharts)
#   /static/    -> 本地静态资源 (echarts.min.js 等)
# ============================================================
server {
    listen 80;                      # 监听 HTTP 默认端口
    server_name www.test.com;       # 匹配主域名

    # 静态资源 -- 动静分离, Nginx 直接响应, 不经过 Flask alias 末尾必须带 /, 对应 location 路径前缀剥离后的文件路径
    location /static/ {
        alias /opt/Python_Practice_Script/Server_Tool/ops_monitor/static/;
        expires 7d;                 # 浏览器缓存 7 天 (echarts.min.js 等不常变的文件)
        access_log off;             # 静态资源不写访问日志, 减少 I/O
    }

    # 其他所有路径 -- 反向代理至 Gunicorn Flask 内部路由: / -> portal.html, /ops -> index.html
    location / {
        proxy_pass         http://127.0.0.1:8000;       # 转发至 Gunicorn 后端
        proxy_set_header   Host              $host;      # 传递客户端请求的域名
        proxy_set_header   X-Real-IP         $remote_addr;         # 传递客户端真实 IP
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;  # 追加代理链 IP
        proxy_set_header   X-Forwarded-Proto $scheme;    # 传递协议 (http/https)
    }
}


# ============================================================
# 虚拟主机 2: 企业官方博客
# 域名: blog.test.com
# 后端: server01 (172.16.10.10) Apache2 + WordPress
# 说明: 使用子域名而非子路径 (/blog), 避免 WordPress 静态资源路径错乱
# ============================================================
server {
    listen 80;
    server_name blog.test.com;      # 匹配博客子域名

    location / {
        proxy_pass         http://172.16.10.10;          # 转发至 server01
        proxy_set_header   Host              $host;      # WordPress 需要此头判断站点域名
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}


# ============================================================
# 虚拟主机 3: 技术交流社区
# 域名: bbs.test.com
# 后端: server02 (172.16.10.11) Apache2 + Discuz!
# 说明: 同上, 子域名方案确保 Discuz! 生成的链接和资源路径正确
# ============================================================
server {
    listen 80;
    server_name bbs.test.com;       # 匹配论坛子域名

    location / {
        proxy_pass         http://172.16.10.11;          # 转发至 server02
        proxy_set_header   Host              $host;      # Discuz! 需要此头判断站点域名
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}