# ops_monitor.conf -- Nginx 反向代理配置
# 部署位置: /etc/nginx/conf.d/ops_monitor.conf
# 测试配置: nginx -t
# 重载生效: systemctl reload nginx
#
# [域名配置] 若域名变更, 修改下方 server_name 即可

server {
    listen 80;
    server_name www.test.com;

    # ── 静态资源 (动静分离, 7 天缓存) ────────────────────────
    location /static/ {
        alias /opt/Python_Practice_Script/Server_Tool/ops_monitor/static/;
        expires 7d;
        access_log off;
    }

    # ── 监控看板 (/ops) ─────────────────────────────────────
    location /ops {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── 博客跳转 (302 重定向至 server01) ────────────────────
    location = /blog {
        return 302 http://172.16.10.10;
    }

    # ── 论坛跳转 (302 重定向至 server02) ────────────────────
    location = /bbs {
        return 302 http://172.16.10.11;
    }

    # ── 门户主页及其他路径 (反代至 Flask) ───────────────────
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
