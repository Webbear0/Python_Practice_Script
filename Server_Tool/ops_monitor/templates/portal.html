<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPS Monitor -- 统一导航门户</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }

        /* 顶栏 */
        .header { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border-bottom: 1px solid #334155;
                  padding: 20px 30px; text-align: center; }
        .header h1 { font-size: 24px; font-weight: 600; letter-spacing: 2px; color: #f1f5f9; }
        .header p  { font-size: 13px; color: #94a3b8; margin-top: 6px; }

        /* 架构信息栏 */
        .arch-bar { max-width: 900px; margin: 24px auto 0; display: flex; justify-content: center;
                    gap: 28px; flex-wrap: wrap; font-size: 13px; color: #94a3b8; }
        .arch-item { display: flex; align-items: center; gap: 6px; }
        .arch-dot  { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .dot-green  { background: #22c55e; box-shadow: 0 0 6px #22c55e88; }
        .dot-blue   { background: #3b82f6; box-shadow: 0 0 6px #3b82f688; }
        .dot-purple { background: #a855f7; box-shadow: 0 0 6px #a855f788; }
        .dot-amber  { background: #f59e0b; box-shadow: 0 0 6px #f59e0b88; }

        /* 卡片容器 */
        .cards { max-width: 1000px; margin: 40px auto; padding: 0 20px;
                 display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }

        /* 单张卡片 */
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px;
                padding: 28px 24px; text-decoration: none; color: #e2e8f0;
                transition: transform .2s, border-color .2s, box-shadow .2s; position: relative; overflow: hidden; }
        .card:hover { transform: translateY(-4px); border-color: #60a5fa;
                      box-shadow: 0 8px 30px rgba(96, 165, 250, .15); }
        .card-icon { width: 48px; height: 48px; border-radius: 10px; display: flex;
                     align-items: center; justify-content: center; margin-bottom: 16px; }
        .card-icon svg { width: 26px; height: 26px; }
        .icon-ops    { background: rgba(59,130,246,.15); }
        .icon-ops svg    { fill: #60a5fa; }
        .icon-blog   { background: rgba(34,197,94,.15); }
        .icon-blog svg   { fill: #4ade80; }
        .icon-bbs    { background: rgba(168,85,247,.15); }
        .icon-bbs svg    { fill: #c084fc; }
        .card h2 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
        .card .desc { font-size: 13px; color: #94a3b8; line-height: 1.6; }
        .card .tag  { display: inline-block; margin-top: 14px; font-size: 12px; padding: 3px 10px;
                      border-radius: 4px; background: #0f172a; color: #64748b; border: 1px solid #334155; }
        .card .arrow { position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
                       opacity: 0; transition: opacity .2s; }
        .card .arrow svg { width: 20px; height: 20px; fill: #60a5fa; }
        .card:hover .arrow { opacity: 1; }

        /* 底栏 */
        .footer { text-align: center; padding: 30px 20px; font-size: 12px; color: #475569; }
    </style>
</head>
<body>
    <!-- 顶栏 -->
    <div class="header">
        <h1>OPS Monitor -- 统一导航门户</h1>
        <p>Nginx + Gunicorn + Flask | 集群网关统一入口</p>
    </div>


    <!-- 业务跳转卡片 -->
    <div class="cards">
        <!-- 运维监控中心 -->
        <a class="card" href="/ops">
            <div class="card-icon icon-ops">
                <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
            </div>
            <h2>运维监控中心</h2>
            <p class="desc">服务器资源实时监控、服务状态巡检与故障自愈，数据可视化看板。</p>
            <div class="arrow"><svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></div>
        </a>

        <!-- 企业官方博客 -->
        <a class="card" href="//blog.test.com">
            <div class="card-icon icon-blog">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
            </div>
            <h2>企业官方博客</h2>
            <p class="desc">公司动态发布、技术文章分享与知识沉淀平台。</p>
            <span class="tag">blog.test.com | WordPress</span>
            <div class="arrow"><svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></div>
        </a>

        <!-- 技术交流社区 -->
        <a class="card" href="//bbs.test.com">
            <div class="card-icon icon-bbs">
                <svg viewBox="0 0 24 24"><path d="M21 6h-2v9H6v2c0 .55.45 1 1 1h11l4 4V7c0-.55-.45-1-1-1zm-4 6V3c0-.55-.45-1-1-1H3c-.55 0-1 .45-1 1v14l4-4h10c.55 0 1-.45 1-1z"/></svg>
            </div>
            <h2>技术交流社区</h2>
            <p class="desc">团队内部技术讨论、问题求助与经验交流论坛。</p>
            <span class="tag">bbs.test.com | Discuz!</span>
            <div class="arrow"><svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></div>
        </a>
    </div>

    <div class="footer">OPS Monitor &copy; 2026 | Nginx + Gunicorn + Flask | www.test.com</div>
</body>
</html>
